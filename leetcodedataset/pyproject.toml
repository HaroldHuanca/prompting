[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leetcode-dataset-builder"
version = "0.1.0"
description = "Build and filter a LeetCode problem dataset for experimental research."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Copilot" }]
dependencies = [
  "datasets>=2.20.0",
  "huggingface_hub>=0.23.0",
  "pyarrow>=15.0.0",
  "pandas>=2.0.0",
]

[tool.setuptools]
packages = ["leetcode_dataset"]
